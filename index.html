<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Infirmia — Assistant clinique infirmier</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect x='78' y='22' width='44' height='156' rx='22' fill='%23063A8C'/><rect x='22' y='78' width='156' height='44' rx='22' fill='%233B6FE3' fill-opacity='.92'/><rect x='78' y='78' width='44' height='44' rx='14' fill='%233FBFFF' fill-opacity='.7'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    /* ─── Tokens ─────────────────────────────────────────────────── */
    :root {
      --navy-900: #042561;
      --navy-800: #063A8C;
      --blue-700: #1E54C9;
      --blue-600: #3B6FE3;
      --blue-500: #5B9BFF;
      --cyan-400: #3FBFFF;
      --cyan-300: #8FD7FF;

      --ink-900: #0B1220;
      --ink-800: #1A2233;
      --ink-700: #2A3447;
      --ink-500: #5B6781;
      --ink-400: #8B95AC;
      --ink-300: #B8C0D0;
      --ink-200: #D9DEE8;
      --ink-100: #ECEFF5;
      --ink-50:  #F5F7FB;
      --paper:   #FAFBFD;
      --white:   #FFFFFF;

      --radius-sm: 8px;
      --radius:    12px;
      --radius-lg: 18px;
      --radius-xl: 24px;

      --shadow-xs: 0 1px 2px rgba(11, 18, 32, 0.04);
      --shadow-sm: 0 2px 8px rgba(11, 18, 32, 0.06);
      --shadow:    0 6px 24px rgba(11, 18, 32, 0.08);
      --shadow-lg: 0 14px 40px rgba(11, 18, 32, 0.12);

      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; }
    body {
      font-family: var(--font-sans);
      font-feature-settings: "cv11", "ss01";
      color: var(--ink-800);
      background: var(--ink-50);
      -webkit-font-smoothing: antialiased;
      font-size: 15px;
      line-height: 1.5;
    }
    button { font-family: inherit; cursor: pointer; }

    /* ─── App layout ─────────────────────────────────────────────── */
    .app {
      display: grid;
      grid-template-columns: 288px 1fr;
      height: 100vh;
      background: var(--ink-50);
    }
    .app:has(.sidebar.collapsed) { grid-template-columns: 0 1fr; }

    /* ─── Sidebar ────────────────────────────────────────────────── */
    .sidebar {
      background: var(--white);
      border-right: 1px solid var(--ink-200);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform .25s ease, width .25s ease;
    }
    .sidebar.collapsed { transform: translateX(-100%); width: 0; border-right: 0; }

    .brand {
      padding: 18px 18px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--ink-100);
    }
    .brand-name {
      font-weight: 800;
      letter-spacing: 0.06em;
      font-size: 14px;
      color: var(--ink-900);
    }
    .brand-tag {
      font-size: 10.5px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-500);
      margin-top: 2px;
    }

    .new-chat {
      margin: 14px 14px 10px;
      padding: 11px 14px;
      background: var(--navy-800);
      color: var(--white);
      border: 0;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      transition: background .15s, transform .1s;
      box-shadow: 0 2px 6px rgba(6, 58, 140, 0.25);
    }
    .new-chat:hover { background: var(--navy-900); }
    .new-chat:active { transform: translateY(1px); }

    .search-wrap {
      margin: 0 14px 12px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-wrap svg {
      position: absolute;
      left: 11px;
      color: var(--ink-400);
    }
    .search-wrap input {
      width: 100%;
      padding: 9px 10px 9px 32px;
      background: var(--ink-50);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--ink-800);
      outline: none;
      font-family: inherit;
    }
    .search-wrap input::placeholder { color: var(--ink-400); }
    .search-wrap input:focus { background: var(--white); border-color: var(--blue-500); }
    .search-clear {
      position: absolute;
      right: 7px;
      background: transparent;
      border: 0;
      color: var(--ink-400);
      display: grid;
      place-items: center;
      padding: 4px;
      border-radius: 4px;
      cursor: pointer;
      line-height: 0;
    }
    .search-clear:hover { color: var(--ink-700); background: var(--ink-100); }

    .history {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 8px;
    }
    .history-group { margin-bottom: 4px; }
    .history-date {
      font-size: 10.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-400);
      font-weight: 600;
      padding: 10px 10px 6px;
    }
    .history-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--ink-700);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      transition: background .12s;
    }
    .history-item:hover { background: var(--ink-50); }
    .history-item.active { background: rgba(59, 111, 227, 0.1); color: var(--navy-800); font-weight: 500; }
    .history-empty {
      padding: 24px 10px;
      text-align: center;
      font-size: 12.5px;
      color: var(--ink-400);
    }

    .sidebar-foot {
      border-top: 1px solid var(--ink-100);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .source-badge {
      font-size: 11.5px;
      color: var(--ink-500);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: var(--ink-50);
      border-radius: var(--radius-sm);
      font-weight: 500;
    }
    .src-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #16a34a;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
      flex-shrink: 0;
    }
    .src-count {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--ink-400);
    }

    .user-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue-600), var(--navy-800));
      color: var(--white);
      font-size: 12px;
      font-weight: 700;
      display: grid;
      place-items: center;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 13px; font-weight: 600; color: var(--ink-900); }
    .user-role { font-size: 11.5px; color: var(--ink-500); }

    .icon-btn {
      background: transparent;
      border: 0;
      color: var(--ink-500);
      padding: 6px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      transition: background .12s, color .12s;
    }
    .icon-btn:hover { background: var(--ink-100); color: var(--ink-800); }
    .icon-btn.ghost { color: var(--ink-500); }

    /* ─── Main ──────────────────────────────────────────────────── */
    .main {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--paper);
    }

    .header {
      height: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 22px;
      border-bottom: 1px solid var(--ink-200);
      background: rgba(250, 251, 253, 0.85);
      backdrop-filter: saturate(180%) blur(8px);
      flex-shrink: 0;
    }
    .header-title {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
      gap: 3px;
    }
    .header-eyebrow {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-400);
      font-weight: 600;
    }
    .header-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-900);
    }
    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px 5px 9px;
      background: rgba(22, 163, 74, 0.08);
      border: 1px solid rgba(22, 163, 74, 0.2);
      color: #15803d;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 999px;
      margin-right: 8px;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
      50%       { box-shadow: 0 0 0 5px rgba(34, 197, 94, 0); }
    }

    /* ─── Chat area ─────────────────────────────────────────────── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    /* Welcome */
    .welcome {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      box-sizing: border-box;
    }
    .welcome-inner {
      width: 100%;
      max-width: 760px;
      text-align: center;
    }
    .welcome-mark {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: var(--white);
      border: 1px solid var(--ink-200);
      box-shadow: var(--shadow-sm);
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
    }
    .welcome-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--ink-900);
      letter-spacing: -0.02em;
      margin: 0 0 10px;
      text-wrap: balance;
    }
    .welcome-sub {
      font-size: 15px;
      color: var(--ink-500);
      max-width: 540px;
      margin: 0 auto 32px;
      line-height: 1.55;
    }
    .welcome-sub strong { color: var(--ink-800); font-weight: 600; }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 36px;
    }
    .suggestion {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--white);
      border: 1px solid var(--ink-200);
      border-radius: var(--radius);
      text-align: left;
      transition: all .15s;
      font-family: inherit;
      color: var(--ink-800);
    }
    .suggestion:hover {
      border-color: var(--blue-500);
      box-shadow: 0 4px 14px rgba(59, 111, 227, 0.1);
      transform: translateY(-1px);
    }
    .suggestion-icon {
      font-size: 22px;
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      background: var(--ink-50);
      border-radius: var(--radius-sm);
    }
    .suggestion-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .suggestion-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-900);
    }
    .suggestion-q {
      font-size: 12.5px;
      color: var(--ink-500);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .suggestion-arrow {
      color: var(--ink-300);
      flex-shrink: 0;
      transition: transform .15s, color .15s;
    }
    .suggestion:hover .suggestion-arrow {
      color: var(--blue-600);
      transform: translateX(2px);
    }

    .capabilities {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding-top: 24px;
      border-top: 1px solid var(--ink-200);
    }
    .capability {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      text-align: left;
    }
    .cap-icon {
      width: 32px; height: 32px;
      border-radius: var(--radius-sm);
      background: rgba(59, 111, 227, 0.08);
      color: var(--navy-800);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .cap-icon svg { width: 16px; height: 16px; }
    .cap-title { font-size: 13px; font-weight: 600; color: var(--ink-900); }
    .cap-desc { font-size: 12px; color: var(--ink-500); }

    /* ─── Messages ───────────────────────────────────────────────── */
    .messages {
      max-width: 780px;
      margin: 0 auto;
      padding: 28px 24px 40px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-sizing: border-box;
    }
    .msg {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      animation: fadeUp .3s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
    }
    .user-avatar {
      background: linear-gradient(135deg, var(--blue-600), var(--navy-800));
      color: var(--white);
    }
    .bot-avatar {
      background: var(--white);
      border: 1px solid var(--ink-200);
    }
    .user-msg { flex-direction: row-reverse; }
    .user-bubble {
      background: var(--navy-800);
      color: var(--white);
      padding: 11px 16px;
      border-radius: 16px 16px 4px 16px;
      max-width: 80%;
      font-size: 14.5px;
      line-height: 1.5;
    }
    .msg-body { flex: 1; min-width: 0; }

    .answer {
      font-size: 14.5px;
      line-height: 1.65;
      color: var(--ink-800);
    }
    .ans-p { margin: 0 0 10px; }
    .ans-heading {
      margin: 16px 0 8px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-900);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ans-heading::before {
      content: "";
      width: 3px;
      height: 14px;
      background: var(--blue-600);
      border-radius: 2px;
      flex-shrink: 0;
    }
    .ans-bullet {
      list-style: none;
      position: relative;
      padding-left: 18px;
      margin: 4px 0;
    }
    .ans-bullet::before {
      content: "";
      position: absolute;
      left: 4px; top: 10px;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--blue-600);
    }
    .ans-bullet.num::before { display: none; }

    .cite-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      margin: 0 2px;
      background: rgba(59, 111, 227, 0.1);
      color: var(--navy-800);
      border-radius: 5px;
      font-size: 10.5px;
      font-weight: 700;
      font-family: var(--font-mono);
      vertical-align: super;
      line-height: 1;
      cursor: pointer;
      transition: background .12s;
      border: 1px solid rgba(59, 111, 227, 0.2);
    }
    .cite-chip:hover { background: var(--blue-600); color: var(--white); }

    /* Source attribution line */
    .msg-source {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--ink-400);
      margin-top: 10px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    /* Action row */
    .msg-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .msg-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      background: transparent;
      border: 1px solid var(--ink-200);
      border-radius: var(--radius-sm);
      color: var(--ink-500);
      font-size: 11.5px;
      font-weight: 500;
      transition: all .12s;
    }
    .msg-action:hover {
      background: var(--white);
      color: var(--ink-800);
      border-color: var(--ink-300);
    }
    .msg-action.copied {
      background: rgba(22, 163, 74, 0.08);
      border-color: rgba(22, 163, 74, 0.3);
      color: #15803d;
    }

    /* Error message */
    .error-msg {
      color: #b91c1c;
      background: rgba(239, 68, 68, 0.06);
      border: 1px solid rgba(239, 68, 68, 0.15);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 14px;
    }

    /* Thinking */
    .thinking {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
    }
    .thinking-dots {
      display: flex;
      gap: 4px;
    }
    .thinking-dots span {
      width: 7px; height: 7px;
      background: var(--blue-600);
      border-radius: 50%;
      animation: bounce 1.3s infinite ease-in-out;
    }
    .thinking-dots span:nth-child(2) { animation-delay: .15s; }
    .thinking-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
    .thinking-text {
      font-size: 13px;
      color: var(--ink-500);
      font-style: italic;
    }

    /* ─── Composer ──────────────────────────────────────────────── */
    .composer-wrap {
      padding: 14px 24px 18px;
      max-width: 828px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      flex-shrink: 0;
    }
    .composer {
      background: var(--white);
      border: 1px solid var(--ink-200);
      border-radius: var(--radius-lg);
      padding: 14px 16px 10px;
      box-shadow: var(--shadow-sm);
      transition: border-color .15s, box-shadow .15s;
    }
    .composer:focus-within {
      border-color: var(--blue-500);
      box-shadow: 0 0 0 4px rgba(91, 155, 255, 0.15), var(--shadow-sm);
    }
    .composer textarea {
      width: 100%;
      border: 0;
      resize: none;
      outline: none;
      font-family: inherit;
      font-size: 14.5px;
      line-height: 1.5;
      color: var(--ink-900);
      background: transparent;
      padding: 0;
      max-height: 200px;
    }
    .composer textarea::placeholder { color: var(--ink-400); }

    .composer-actions {
      display: flex;
      align-items: center;
      margin-top: 8px;
      gap: 8px;
    }
    .composer-tools {
      display: flex;
      gap: 6px;
      flex: 1;
      flex-wrap: wrap;
    }
    .tool-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      background: var(--ink-50);
      border: 1px solid var(--ink-200);
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--ink-700);
      transition: all .12s;
    }
    .tool-chip:hover {
      background: var(--white);
      border-color: var(--ink-300);
      color: var(--ink-900);
    }

    .send-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--navy-800);
      color: var(--white);
      border: 0;
      display: grid;
      place-items: center;
      transition: background .15s, transform .1s;
      flex-shrink: 0;
    }
    .send-btn:hover:not(:disabled) { background: var(--navy-900); }
    .send-btn:active:not(:disabled) { transform: scale(0.95); }
    .send-btn:disabled {
      background: var(--ink-200);
      color: var(--ink-400);
      cursor: not-allowed;
    }

    .composer-foot {
      font-size: 11.5px;
      color: var(--ink-400);
      text-align: center;
      margin-top: 10px;
      line-height: 1.5;
    }
    .composer-foot kbd {
      font-family: var(--font-mono);
      background: var(--white);
      border: 1px solid var(--ink-200);
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10.5px;
      color: var(--ink-700);
      margin: 0 2px;
    }

    /* ─── Scrollbars ────────────────────────────────────────────── */
    .chat-area::-webkit-scrollbar,
    .history::-webkit-scrollbar { width: 8px; }
    .chat-area::-webkit-scrollbar-thumb,
    .history::-webkit-scrollbar-thumb {
      background: var(--ink-200);
      border-radius: 999px;
    }
    .chat-area::-webkit-scrollbar-thumb:hover,
    .history::-webkit-scrollbar-thumb:hover { background: var(--ink-300); }

    /* ─── Responsive ────────────────────────────────────────────── */
    @media (max-width: 880px) {
      .app { grid-template-columns: 0 1fr; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 288px;
        z-index: 20;
        box-shadow: var(--shadow-lg);
        transform: translateX(-100%);
      }
      .sidebar:not(.collapsed) { transform: translateX(0); }
      .suggestions { grid-template-columns: 1fr; }
      .capabilities { grid-template-columns: 1fr; }
      .welcome-title { font-size: 22px; }
      .status-pill { display: none; }
    }

    /* ─── Rich answer formatting ────────────────────────────────── */
    /* ## Section heading */
    .ans-h2 {
      margin: 20px 0 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy-800);
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--ink-100);
      letter-spacing: 0;
    }
    .ans-h2::before {
      content: "";
      width: 3px;
      height: 14px;
      background: var(--blue-600);
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* Source card (Sources utilisées section) */
    .ans-source-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 12px;
      background: var(--ink-50);
      border: 1px solid var(--ink-200);
      border-radius: var(--radius-sm);
      margin: 5px 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--ink-700);
    }
    .ans-source-item::before {
      content: "📄";
      flex-shrink: 0;
      font-size: 12px;
      margin-top: 2px;
    }

    /* Reflection callout box */
    .ans-reflection {
      background: rgba(59, 111, 227, 0.05);
      border: 1px solid rgba(59, 111, 227, 0.15);
      border-left: 3px solid var(--blue-600);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 10px 14px;
      margin: 6px 0 10px;
      font-style: italic;
      color: var(--ink-700);
      font-size: 14px;
      line-height: 1.6;
    }

    /* Inline clickable link chip */
    .ans-link {
      color: var(--blue-600);
      text-decoration: none;
      font-weight: 600;
      font-size: 11.5px;
      font-family: var(--font-mono);
      padding: 1px 6px;
      background: rgba(59, 111, 227, 0.08);
      border: 1px solid rgba(59, 111, 227, 0.2);
      border-radius: 4px;
      transition: all .12s;
      vertical-align: middle;
      white-space: nowrap;
    }
    .ans-link:hover {
      background: var(--blue-600);
      color: var(--white);
      border-color: var(--blue-600);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    /* ─── Config ────────────────────────────────────────────────── */
    const WEBHOOK_URL = "https://n8n.mouadcloud.duckdns.org/webhook/1c415e5b-8e1d-4330-8cb8-431577ae4219/chat";
    const TIMEOUT_MS  = 120000;
    const STORAGE_KEY = "infirmia_history";

    /* ─── Persistence helpers ───────────────────────────────────── */
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
      catch { return []; }
    }
    function saveHistory(h) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); } catch {}
    }

    /* ─── Date label for grouping ────────────────────────────────── */
    function getDateLabel(ts) {
      const now   = new Date();
      const d     = new Date(ts);
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const item  = new Date(d.getFullYear(),   d.getMonth(),   d.getDate()).getTime();
      const diff  = Math.round((today - item) / 86400000);
      if (diff === 0) return "Aujourd'hui";
      if (diff === 1) return "Hier";
      const DAYS   = ["Dim.", "Lun.", "Mar.", "Mer.", "Jeu.", "Ven.", "Sam."];
      const MONTHS = ["jan.", "fév.", "mar.", "avr.", "mai", "juin", "juil.", "août", "sep.", "oct.", "nov.", "déc."];
      if (diff < 7) return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
      return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    }

    /* ─── Suggested topics ──────────────────────────────────────── */
    const SUGGESTIONS = [
      { icon: "💉", title: "Antisepsie cutanée",      q: "Quelle est la meilleure solution antiseptique pour la pose d'un cathéter central ?" },
      { icon: "🛏️", title: "Prévention des escarres",  q: "Quelles interventions infirmières préviennent efficacement les escarres en soins aigus ?" },
      { icon: "🫁", title: "Mobilisation précoce",     q: "Quels sont les bénéfices de la mobilisation précoce chez le patient ventilé ?" },
      { icon: "🧴", title: "Hygiène des mains",        q: "Friction hydro-alcoolique ou lavage au savon : quand utiliser quoi ?" },
      { icon: "📊", title: "Évaluation de la douleur", q: "Comment évaluer la douleur chez un patient non communicant en réanimation ?" },
      { icon: "🩺", title: "Injection sous-cutanée",   q: "Quelles sont les recommandations actuelles pour l'injection d'insuline en SC ?" },
    ];

    /* ─── Main App ──────────────────────────────────────────────── */
    function App() {
      const [messages,      setMessages]      = useState([]);
      const [input,         setInput]         = useState("");
      const [loading,       setLoading]       = useState(false);
      const [sidebarOpen,   setSidebarOpen]   = useState(true);
      const [history,       setHistory]       = useState(loadHistory);   // persisted
      const [currentChatId, setCurrentChatId] = useState(null);
      const [sessionId,     setSessionId]     = useState(() => crypto.randomUUID());
      const scrollRef = useRef(null);

      useEffect(() => {
        if (scrollRef.current)
          scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
      }, [messages, loading]);

      async function send(text) {
        const q = (text ?? input).trim();
        if (!q || loading) return;
        setInput("");

        const userMsg = { role: "user", content: q, id: Date.now() };
        let chatId = currentChatId;

        if (!chatId) {
          // First message in a new conversation — create history entry
          chatId = crypto.randomUUID();
          setCurrentChatId(chatId);
          const entry = {
            id: chatId,
            sessionId,
            title: q.length > 55 ? q.slice(0, 53) + "…" : q,
            timestamp: Date.now(),
            messages: [userMsg],
          };
          setHistory(prev => {
            const next = [entry, ...prev];
            saveHistory(next);
            return next;
          });
        } else {
          // Continuing conversation — move entry to top, append user message
          setHistory(prev => {
            const entry = prev.find(h => h.id === chatId);
            if (!entry) return prev;
            const updated = { ...entry, messages: [...entry.messages, userMsg], timestamp: Date.now() };
            const next    = [updated, ...prev.filter(h => h.id !== chatId)];
            saveHistory(next);
            return next;
          });
        }

        setMessages(prev => [...prev, userMsg]);
        setLoading(true);

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), TIMEOUT_MS);

        try {
          const res = await fetch(WEBHOOK_URL, {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ chatInput: q, sessionId }),
            signal:  controller.signal,
          });
          clearTimeout(timeout);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data   = await res.json();
          const reply  = data.output ?? data.text ?? data.message ?? "Aucune réponse reçue.";
          const botMsg = { role: "assistant", content: reply, id: Date.now() + 1 };
          setMessages(prev => [...prev, botMsg]);
          setHistory(prev => {
            const next = prev.map(h =>
              h.id === chatId ? { ...h, messages: [...h.messages, botMsg] } : h
            );
            saveHistory(next);
            return next;
          });
        } catch (e) {
          clearTimeout(timeout);
          const errText = e.name === "AbortError"
            ? "La requête a expiré. Le workflow n8n met peut-être du temps à répondre — réessayez dans un instant."
            : "Impossible de joindre le serveur. Vérifiez que le workflow n8n est actif et réessayez.";
          const errMsg = { role: "assistant", content: errText, id: Date.now() + 1, error: true };
          setMessages(prev => [...prev, errMsg]);
          setHistory(prev => {
            const next = prev.map(h =>
              h.id === chatId ? { ...h, messages: [...h.messages, errMsg] } : h
            );
            saveHistory(next);
            return next;
          });
        } finally {
          setLoading(false);
        }
      }

      function loadChat(id) {
        const entry = history.find(h => h.id === id);
        if (!entry) return;
        setMessages(entry.messages);
        setCurrentChatId(id);
        setSessionId(entry.sessionId); // restore n8n session context
      }

      function newChat() {
        setMessages([]);
        setCurrentChatId(null);
        setSessionId(crypto.randomUUID());
        setInput("");
      }

      return (
        <div className="app">
          <Sidebar
            open={sidebarOpen}
            onNewChat={newChat}
            onLoadChat={loadChat}
            activeChat={currentChatId}
            history={history}
          />
          <main className="main">
            <Header onToggleSidebar={() => setSidebarOpen(s => !s)} />
            <div className="chat-area" ref={scrollRef}>
              {messages.length === 0 ? (
                <Welcome onPick={q => send(q)} />
              ) : (
                <div className="messages">
                  {messages.map(m => <Message key={m.id} msg={m} />)}
                  {loading && <ThinkingMessage />}
                </div>
              )}
            </div>
            <Composer
              value={input}
              onChange={setInput}
              onSend={() => send()}
              disabled={loading}
            />
          </main>
        </div>
      );
    }

    /* ─── Sidebar ──────────────────────────────────────────────── */
    function Sidebar({ open, onNewChat, onLoadChat, activeChat, history }) {
      const [query, setQuery] = useState("");

      const filtered = useMemo(() => {
        if (!query.trim()) return history;
        const q = query.toLowerCase();
        return history.filter(h => h.title.toLowerCase().includes(q));
      }, [history, query]);

      const grouped = useMemo(() => {
        const g = {};
        filtered.forEach(h => {
          const label = getDateLabel(h.timestamp);
          if (!g[label]) g[label] = [];
          g[label].push(h);
        });
        return g;
      }, [filtered]);

      return (
        <aside className={`sidebar ${open ? "" : "collapsed"}`}>
          <div className="brand">
            <LogoMark size={32} />
            <div className="brand-text">
              <div className="brand-name">INFIRMIA</div>
              <div className="brand-tag">Chercher mieux, écrire juste</div>
            </div>
          </div>

          <button className="new-chat" onClick={onNewChat}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            Nouvelle recherche
          </button>

          <div className="search-wrap">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <circle cx="11" cy="11" r="7"/>
              <path d="m21 21-4.3-4.3"/>
            </svg>
            <input
              placeholder="Rechercher dans l'historique"
              value={query}
              onChange={e => setQuery(e.target.value)}
            />
            {query && (
              <button className="search-clear" onClick={() => setQuery("")} title="Effacer">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
                  <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
            )}
          </div>

          <div className="history">
            {Object.keys(grouped).length === 0 ? (
              <div className="history-empty">
                {query ? "Aucun résultat" : "Aucune conversation"}
              </div>
            ) : (
              Object.entries(grouped).map(([date, items]) => (
                <div className="history-group" key={date}>
                  <div className="history-date">{date}</div>
                  {items.map(h => (
                    <button
                      key={h.id}
                      className={`history-item ${activeChat === h.id ? "active" : ""}`}
                      onClick={() => onLoadChat(h.id)}
                      title={h.title}
                    >
                      {h.title}
                    </button>
                  ))}
                </div>
              ))
            )}
          </div>

          <div className="sidebar-foot">
            <div className="source-badge">
              <span className="src-dot" />
              PubMed + OpenAlex
              <span className="src-count">Temps réel</span>
            </div>
            <div className="user-row">
              <div className="avatar">MD</div>
              <div className="user-info">
                <div className="user-name">Amine et Yahya</div>
                <div className="user-role">ISPITS étudiant(e)</div>
              </div>
              <button className="icon-btn" title="Paramètres">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
              </button>
            </div>
          </div>
        </aside>
      );
    }

    /* ─── Header ───────────────────────────────────────────────── */
    function Header({ onToggleSidebar }) {
      return (
        <header className="header">
          <button className="icon-btn ghost" onClick={onToggleSidebar} aria-label="Basculer la barre latérale">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <path d="M3 12h18M3 6h18M3 18h18"/>
            </svg>
          </button>
          <div className="header-title">
            <span className="header-eyebrow">Assistant clinique</span>
            <span className="header-name">Infirmia</span>
          </div>
          <div className="header-actions">
            <span className="status-pill">
              <span className="status-dot" />
              PubMed &amp; OpenAlex connectés
            </span>
            <button className="icon-btn ghost" title="Aide">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
              </svg>
            </button>
          </div>
        </header>
      );
    }

    /* ─── Welcome screen ───────────────────────────────────────── */
    function Welcome({ onPick }) {
      return (
        <div className="welcome">
          <div className="welcome-inner">
            <div className="welcome-mark">
              <LogoMark size={56} />
            </div>
            <h1 className="welcome-title">Bonjour. Quelle question clinique aujourd'hui&nbsp;?</h1>
            <p className="welcome-sub">
              Je synthétise les données probantes de <strong>PubMed</strong> et <strong>OpenAlex</strong> pour
              appuyer votre pratique infirmière. Chaque réponse est sourcée, datée et adaptée au lit du patient.
            </p>

            <div className="suggestions">
              {SUGGESTIONS.map((s, i) => (
                <button key={i} className="suggestion" onClick={() => onPick(s.q)}>
                  <span className="suggestion-icon">{s.icon}</span>
                  <span className="suggestion-body">
                    <span className="suggestion-title">{s.title}</span>
                    <span className="suggestion-q">{s.q}</span>
                  </span>
                  <svg className="suggestion-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="12 5 19 12 12 19"/>
                  </svg>
                </button>
              ))}
            </div>

            <div className="capabilities">
              <Capability
                icon={<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>}
                title="Données probantes"
                desc="Recherche PubMed + OpenAlex en temps réel"
              />
              <Capability
                icon={<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>}
                title="Synthèse rapide"
                desc="Réponse structurée par l'IA Groq"
              />
              <Capability
                icon={<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M9 12l2 2 4-4"/><path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9c2.39 0 4.68.94 6.36 2.64"/></svg>}
                title="Hiérarchie de preuve"
                desc="Méta-analyses et RCTs prioritaires"
              />
            </div>
          </div>
        </div>
      );
    }

    function Capability({ icon, title, desc }) {
      return (
        <div className="capability">
          <span className="cap-icon">{icon}</span>
          <div>
            <div className="cap-title">{title}</div>
            <div className="cap-desc">{desc}</div>
          </div>
        </div>
      );
    }

    /* ─── Messages ─────────────────────────────────────────────── */
    function Message({ msg }) {
      const [copied, setCopied] = useState(false);

      if (msg.role === "user") {
        return (
          <div className="msg user-msg">
            <div className="msg-bubble user-bubble">{msg.content}</div>
            <div className="msg-avatar user-avatar">MD</div>
          </div>
        );
      }

      function copy() {
        navigator.clipboard.writeText(msg.content).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }).catch(() => {});
      }

      return (
        <div className="msg bot-msg">
          <div className="msg-avatar bot-avatar"><LogoMark size={20} /></div>
          <div className="msg-body">
            {msg.error ? (
              <div className="error-msg">{msg.content}</div>
            ) : (
              <FormattedAnswer content={msg.content} />
            )}
            {!msg.error && (
              <div className="msg-source">
                <span className="src-dot" />
                Données PubMed &amp; OpenAlex · temps réel
              </div>
            )}
            {!msg.error && (
              <div className="msg-actions">
                <button className={`msg-action ${copied ? "copied" : ""}`} onClick={copy}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    {copied
                      ? <polyline points="20 6 9 17 4 12"/>
                      : <><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></>
                    }
                  </svg>
                  {copied ? "Copié !" : "Copier"}
                </button>
                <button className="msg-action" title="Insérer dans transmission">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                  </svg>
                  Insérer en transmission
                </button>
                <button className="msg-action" title="Utile">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M7 10v12"/>
                    <path d="M15 5.88L14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H7"/>
                  </svg>
                </button>
                <button className="msg-action" title="À revoir">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M17 14V2"/>
                    <path d="M9 18.12L10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H17"/>
                  </svg>
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    /* Renders rich markdown: ## headings, source cards, reflection callout, clickable links, bold, italic, citations */
    function FormattedAnswer({ content }) {
      const lines = content.split("\n");
      let currentSection = null;
      const elements = [];

      lines.forEach((line, i) => {
        const t = line.trim();
        if (!t) return;

        // ## Section heading — tracks which section we're in
        if (/^##\s+/.test(t)) {
          const heading = t.replace(/^#+\s+/, "");
          if (/source/i.test(heading))            currentSection = "sources";
          else if (/r[eé]flexion/i.test(heading)) currentSection = "reflection";
          else                                     currentSection = null;
          elements.push(<h4 key={i} className="ans-h2">{heading}</h4>);
          return;
        }

        // Horizontal rule ---
        if (/^---+$/.test(t)) {
          elements.push(<hr key={i} style={{ border: 0, borderTop: "1px solid var(--ink-200)", margin: "14px 0" }} />);
          return;
        }

        // Bullet list item
        if (/^[-•*]\s/.test(t)) {
          const inner = t.replace(/^[-•*]\s/, "");
          if (currentSection === "sources") {
            // Source section → render as card
            elements.push(<div key={i} className="ans-source-item">{renderInline(inner)}</div>);
          } else {
            elements.push(<li key={i} className="ans-bullet">{renderInline(inner)}</li>);
          }
          return;
        }

        // Numbered list
        if (/^\d+[\.\)]\s/.test(t)) {
          const inner = t.replace(/^\d+[\.\)]\s/, "");
          elements.push(<li key={i} className="ans-bullet num">{renderInline(inner)}</li>);
          return;
        }

        // Reflection section → callout box
        if (currentSection === "reflection") {
          elements.push(<div key={i} className="ans-reflection">{renderInline(t)}</div>);
          return;
        }

        // Default paragraph
        elements.push(<p key={i} className="ans-p">{renderInline(line)}</p>);
      });

      return <div className="answer">{elements}</div>;
    }

    function renderInline(text) {
      const parts = [];
      let lastIndex = 0;
      // Order matters: **bold** before *italic*, URLs last
      const regex = /\[(\d+)\]|\*\*(.+?)\*\*|\*([^*\n]+)\*|_(.*?)_|(https?:\/\/[^\s<>"')\]]+)/g;
      let match;
      let key = 0;
      while ((match = regex.exec(text)) !== null) {
        if (match.index > lastIndex) parts.push(text.slice(lastIndex, match.index));
        if (match[1]) {
          // [n] → blue citation chip superscript
          parts.push(<sup key={key++} className="cite-chip">{match[1]}</sup>);
        } else if (match[2]) {
          // **bold**
          parts.push(<strong key={key++}>{match[2]}</strong>);
        } else if (match[3]) {
          // *italic*
          parts.push(<em key={key++}>{match[3]}</em>);
        } else if (match[4]) {
          // _italic_
          parts.push(<em key={key++}>{match[4]}</em>);
        } else if (match[5]) {
          // URL → labelled clickable chip
          const url = match[5];
          const label = url.includes("pubmed.ncbi.nlm.nih.gov") ? "PubMed ↗"
                      : url.includes("doi.org")                 ? "DOI ↗"
                      : url.includes("openalex.org")            ? "OpenAlex ↗"
                      : "Lien ↗";
          parts.push(
            <a key={key++} href={url} target="_blank" rel="noopener noreferrer" className="ans-link">{label}</a>
          );
        }
        lastIndex = match.index + match[0].length;
      }
      if (lastIndex < text.length) parts.push(text.slice(lastIndex));
      return parts;
    }

    /* ─── Thinking indicator ───────────────────────────────────── */
    function ThinkingMessage() {
      const [stage, setStage] = useState(0);
      const stages = [
        "Interrogation de PubMed & OpenAlex…",
        "Filtrage des essais et méta-analyses…",
        "Synthèse avec Groq IA en cours…",
      ];
      useEffect(() => {
        const t = setInterval(() => setStage(s => (s + 1) % stages.length), 1400);
        return () => clearInterval(t);
      }, []);
      return (
        <div className="msg bot-msg">
          <div className="msg-avatar bot-avatar"><LogoMark size={20} /></div>
          <div className="msg-body">
            <div className="thinking">
              <div className="thinking-dots"><span /><span /><span /></div>
              <span className="thinking-text">{stages[stage]}</span>
            </div>
          </div>
        </div>
      );
    }

    /* ─── Composer ─────────────────────────────────────────────── */
    function Composer({ value, onChange, onSend, disabled }) {
      const taRef = useRef(null);

      useEffect(() => {
        const ta = taRef.current;
        if (!ta) return;
        ta.style.height = "auto";
        ta.style.height = Math.min(ta.scrollHeight, 200) + "px";
      }, [value]);

      function onKey(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          onSend();
        }
      }

      return (
        <div className="composer-wrap">
          <div className="composer">
            <textarea
              ref={taRef}
              rows={1}
              placeholder="Posez votre question clinique — ex. « protocole de prévention des chutes chez la personne âgée hospitalisée »"
              value={value}
              onChange={e => onChange(e.target.value)}
              onKeyDown={onKey}
              disabled={disabled}
            />
            <div className="composer-actions">
              <div className="composer-tools">
                <button className="tool-chip" title="Filtres de recherche">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                  </svg>
                  Filtres
                </button>
                <button className="tool-chip" title="Spécialité">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/>
                  </svg>
                  Spécialité
                </button>
                <button className="tool-chip" title="Période">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                  </svg>
                  5 dernières années
                </button>
              </div>
              <button
                className="send-btn"
                onClick={onSend}
                disabled={disabled || !value.trim()}
                title="Envoyer (Entrée)"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"/>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
              </button>
            </div>
          </div>
          <div className="composer-foot">
            Infirmia synthétise les données probantes — vérifiez toujours auprès du protocole de service avant tout acte.&nbsp;
            <kbd>↵</kbd> pour envoyer · <kbd>⇧↵</kbd> pour saut de ligne
          </div>
        </div>
      );
    }

    /* ─── Logo mark ────────────────────────────────────────────── */
    function LogoMark({ size = 32 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 200 200" fill="none" aria-hidden="true">
          <rect x="78" y="22"  width="44" height="156" rx="22" fill="#063A8C"/>
          <rect x="22" y="78"  width="156" height="44" rx="22" fill="#3B6FE3" fillOpacity="0.92"/>
          <rect x="78" y="78"  width="44" height="44"  rx="14" fill="#3FBFFF" fillOpacity="0.7"/>
        </svg>
      );
    }

    /* ─── Mount ────────────────────────────────────────────────── */
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
